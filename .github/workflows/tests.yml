name: BayTag development tests
on:
  push:
    branches: [baytag-v2.2]
  pull_request:
    branches: [baytag-v2.2]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
